{% load static %}
<h2>{{ quiz.title }}</h2>

<h3>{{ question.order }}. {{ question.text }}</h3>
<head> <link rel="stylesheet" href="{% static 'styles.css'%}"> </head>

{% if is_correct == None %}
    <form method="post">
        {% csrf_token %}
        {% for answer in answers %}
            <button type="submit" name="answer_id" value="{{ answer.id }}">
                {{ answer.text }}
            </button>
            <br><br>
        {% endfor %}
    </form>
{% else %}
    {% if is_correct %}
        <p style="color: green;">✅ Правильно!</p>
    {% else %}
        <p style="color: red;">❌ Неправильно</p>
    {% endif %}

    <a href="{% url 'quiz_question' quiz.id next_question %}">
        <button>Далі</button>
    </a>
{% endif %}
